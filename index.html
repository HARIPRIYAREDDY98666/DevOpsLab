<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impressive Interactive Dashboard</title>
    <style>
        /* Modern CSS Variables & Reset */
        :root {
            --bg-dark: #0a0f1d;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border-glow: rgba(0, 242, 254, 0.2);
            --primary-glow: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            --accent-pink: #ff007f;
            --text-main: #f0f4f8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* Animated Gradient Background */
        body {
            background: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Moving Background Grid Matrix */
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(rgba(0, 242, 254, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 254, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            animation: pan 120s linear infinite;
            z-index: 1;
        }

        @keyframes pan {
            from { transform: translate(0, 0); }
            to { transform: translate(-50%, -50%); }
        }

        /* Glassmorphism Interactive Glass Card */
        .card {
            position: relative;
            z-index: 10;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow);
            padding: 3rem;
            border-radius: 24px;
            width: 90%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 
                        inset 0 1px 2px rgba(255, 255, 255, 0.1);
            transform: translateY(0);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: rgba(0, 242, 254, 0.5);
            box-shadow: 0 30px 60px rgba(0, 242, 254, 0.15), 
                        inset 0 1px 2px rgba(255, 255, 255, 0.2);
        }

        /* Glowing Typography Animations */
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: var(--primary-glow);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        p {
            color: #8a99ad;
            font-size: 1rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        /* Dynamic Digital Counter Component */
        .counter-display {
            font-size: 3.5rem;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 2rem;
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.6);
            font-variant-numeric: tabular-nums;
        }

        /* Futuristic Action Button Layout */
        .btn {
            background: var(--primary-glow);
            color: #000;
            font-weight: 700;
            border: none;
            padding: 1rem 2.5rem;
            font-size: 1rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.4);
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(0, 242, 254, 0.7);
            color: #ffffff;
        }

        /* JavaScript Spark Particle Container */
        .particle {
            position: absolute;
            background: rgba(0, 242, 254, 0.8);
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
            animation: explode 0.8s ease-out forwards;
        }

        @keyframes explode {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--x), var(--y)) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Main Glassmorphic Interface Window -->
    <div class="card">
        <h1>DevOps Workspace</h1>
        <p>Interactive automated test deployment matrix.</p>
        
        <!-- Live JavaScript Controlled Counter -->
        <div class="counter-display" id="totalBuilds">0</div>
        
        <button class="btn" onclick="triggerAction(event)">Execute Deploy</button>
    </div>

    <!-- JavaScript For Micro-Interactions & Engine Simulation -->
    <script>
        let count = 0;
        const counterElement = document.getElementById('totalBuilds');

        function triggerAction(event) {
            // Increment UI Counter Object
            count += 1;
            counterElement.textContent = count;

            // Generate Kinetic Screen Burst Particles
            const button = event.target;
            const rect = button.getBoundingClientRect();
            
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Size Variation Elements
                const size = Math.random() * 6 + 4;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                
                // Dynamic Click Vector Tracking
                particle.style.left = `${event.clientX}px`;
                particle.style.top = `${event.clientY}px`;
                
                // Exploded Spread Calculus Property Variables
                const angle = Math.random() * Math.PI * 2;
                const destinationDist = Math.random() * 120 + 30;
                const xDest = Math.cos(angle) * destinationDist;
                const yDest = Math.sin(angle) * destinationDist;
                
                particle.style.setProperty('--x', `${xDest}px`);
                particle.style.setProperty('--y', `${yDest}px`);
                
                document.body.appendChild(particle);
                
                // Garbage Collection Cleaning 
                setTimeout(() => particle.remove(), 800);
            }
        }
    </script>
</body>
</html>
